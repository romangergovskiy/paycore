# Advisory P-01 class labels. Does not skip tests and does not merge.
name: pr-class-labels

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Label financial / docs-class / tests-class
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          class=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | bash .github/scripts/classify-pr-paths.sh)
          echo "class=$class"
          gh pr edit "$PR_NUMBER" --remove-label financial --remove-label docs-class --remove-label tests-class || true
          gh pr edit "$PR_NUMBER" --add-label "$class"
